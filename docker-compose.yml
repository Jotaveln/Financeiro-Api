services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financeiro}
      POSTGRES_USER: ${POSTGRES_USER:-financeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeiro_local_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeiro} -d ${POSTGRES_DB:-financeiro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-financeiro};Username=${POSTGRES_USER:-financeiro};Password=${POSTGRES_PASSWORD:-financeiro_local_change_me}
      Jwt__Key: ${Jwt__Key:-development-only-key-change-before-production-123456}
      Jwt__Issuer: Financeiro.Api
      Jwt__Audience: Financeiro.Web
      Cors__Origins__0: http://localhost:3000
      Seed__Enabled: ${Seed__Enabled:-true}
      Seed__DemoEmail: ${Seed__DemoEmail:-demo@financeiro.local}
      Seed__DemoPassword: ${Seed__DemoPassword:-ChangeThisDemo123!}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
